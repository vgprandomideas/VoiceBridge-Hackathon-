name: Prototype verification
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile streamlit_app.py
      - run: docker compose up -d --build
      - run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose logs && docker compose down
